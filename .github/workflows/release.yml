name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    # TODO: bump to @main once GingerGraham/workbench-core#33 (D40) merges.
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@d926f15a055dccb759cdda545c3c2fc75c097968
    with:
      module_name: gpg
      core_ref: d926f15a055dccb759cdda545c3c2fc75c097968

  release:
    needs: ci
    # TODO: bump to @main and drop core_ref once GingerGraham/workbench-core#33 (D40) merges.
    uses: GingerGraham/workbench-core/.github/workflows/module-release.yml@d926f15a055dccb759cdda545c3c2fc75c097968
    with:
      core_ref: d926f15a055dccb759cdda545c3c2fc75c097968
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

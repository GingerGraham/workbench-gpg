name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    # TODO: bump to @main once GingerGraham/workbench-core#33 (D40) merges.
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@46920fc86bd3eb9519c60b710a8e84f45075cea5
    with:
      module_name: gpg
      core_ref: 46920fc86bd3eb9519c60b710a8e84f45075cea5

  release:
    needs: ci
    # TODO: bump to @main and drop core_ref once GingerGraham/workbench-core#33 (D40) merges.
    uses: GingerGraham/workbench-core/.github/workflows/module-release.yml@46920fc86bd3eb9519c60b710a8e84f45075cea5
    with:
      core_ref: 46920fc86bd3eb9519c60b710a8e84f45075cea5
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

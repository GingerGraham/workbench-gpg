name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@main
    with:
      module_name: gpg
      core_ref: main

  release:
    needs: ci
    # core_ref: main -- see ci.yml's comment on why.
    uses: GingerGraham/workbench-core/.github/workflows/module-release.yml@main
    with:
      core_ref: main
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "workbench-core ref to test against (default: core's latest published release)"
        required: false

jobs:
  module-ci:
    # TODO: bump to @main once GingerGraham/workbench-core#33 (D40) merges.
    # Pinned to that PR's branch HEAD sha for now (reusable-workflow `uses:`
    # refs can't contain a "/", so the branch name itself can't be used
    # here) so this actually runs end-to-end while both are under review.
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@6a3e19d6b017986aae3fbbb87d1b94cae193de44
    with:
      module_name: gpg
      # github.event.inputs.* (not the `inputs` context) is the form that's
      # always safe to reference regardless of which event triggered this
      # run -- the bare `inputs` context only exists for workflow_dispatch/
      # workflow_call-triggered runs and errors out on a pull_request run.
      # Defaults to the in-flight core PR branch for now (its "add to
      # core" script doesn't exist on any published release yet) --
      # TODO: drop this default back to empty (core's latest release)
      # once GingerGraham/workbench-core#33 (D40) merges.
      core_ref: ${{ github.event.inputs.core_ref || 'claude/workbench-extension-ci-ska0he' }}

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "workbench-core ref to test against (default: core's latest release)"
        required: false

permissions:
  contents: read

jobs:
  module-ci:
    # Pinned to a core release tag (workbench-core D78); Dependabot bumps it.
    # core_ref empty = core's latest release. Pass a ref via
    # workflow_dispatch to test against an in-flight core change.
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@v2.22.0
    permissions:
      contents: read
    with:
      module_name: gpg
      core_ref: ${{ github.event.inputs.core_ref || '' }}

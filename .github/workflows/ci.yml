name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "workbench-core ref to test against (default: core's latest published release)"
        required: false

jobs:
  module-ci:
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@main
    with:
      module_name: gpg
      core_ref: ${{ github.event.inputs.core_ref }}

name: Release Finalize

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  finalize:
    # Gated here too (module-release-finalize.yml also gates internally)
    # so a run isn't scheduled at all for an unrelated closed PR.
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    # TODO: bump to @main once GingerGraham/workbench-core#33 (D40) merges.
    uses: GingerGraham/workbench-core/.github/workflows/module-release-finalize.yml@d926f15a055dccb759cdda545c3c2fc75c097968
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
